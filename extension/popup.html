<!doctype html><meta charset="utf-8">
<style>
 body{width:260px;margin:0;padding:14px;font:14px system-ui;background:#fff8f3;color:#3b2f2f}
 h1{font-size:16px;margin:0 0 8px}
 #time{font-size:38px;font-weight:700;text-align:center;margin:6px 0}
 #phase{text-align:center;color:#a07a6a;margin-bottom:10px}
 button{width:100%;padding:8px;margin:3px 0;border:0;border-radius:10px;background:#f4a9a0;color:#3b2f2f;font-weight:600;cursor:pointer}
 button.sec{background:#eadbd3}
 label{display:flex;justify-content:space-between;align-items:center;margin:6px 0}
 input[type=number]{width:56px}
</style>
<h1>🐱 Kitten Pomodoro</h1>
<div id="time">--:--</div><div id="phase"></div>
<button id="start">Bắt đầu làm việc</button>
<button id="stop" class="sec">Dừng</button>
<button id="test" class="sec">Thử mèo chặn màn hình (nghỉ ngay)</button>
<hr>
<label>Làm (phút) <input id="workMin" type="number" min="1" max="120"></label>
<label>Nghỉ (phút) <input id="breakMin" type="number" min="1" max="60"></label>
<label>Âm lượng <input id="volume" type="range" min="0" max="1" step="0.05"></label>
<label>Hiện mèo <input id="catOn" type="checkbox"></label>
<script src="popup.js"></script>
