<!doctype html><meta charset="utf-8"><title>Kitten overlay</title>
<style>html,body{margin:0;height:100%;background:transparent;overflow:hidden}</style>
<script src="bridge.js"></script>
<script src="content.js"></script>
<script>
  // Cửa sổ trong suốt với chuột (click-through). Chỉ nhận chuột khi con trỏ nằm trên mèo hoặc đang chặn màn hình.
  let ignoring = true, mx = -1, my = -1;
  addEventListener('mousemove', (e) => { mx = e.clientX; my = e.clientY; });
  setInterval(() => {
    const k = window.__kitten; if (!k) return;
    const want = k.isBlocking() || k.hit(mx, my);        // want = cần nhận chuột
    if (want === ignoring) { ignoring = !want; kittenDesktop.setIgnore(ignoring); }
  }, 80);
</script>
